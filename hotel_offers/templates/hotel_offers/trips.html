<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Trips | Hotel Offers | Time Tours</title>
<link rel="icon" type="image/png" href="/static/ticket-flight.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/static/dashboard.css">
<link rel="stylesheet" href="/static/sidebar.css">
<link rel="stylesheet" href="{{ url_for('hotel_offers.static', filename='hotel_offers.css') }}">
<link rel="stylesheet" href="{{ url_for('hotel_offers.static', filename='trips/trips.css') }}">
</head>
<body data-tiles="{{ map_tiles }}">
{% include 'components/sidebar.html' %}
<header class="app-header">
  <div class="header-content">
    <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><span class="menu-bar"></span><span class="menu-bar"></span><span class="menu-bar"></span></button>
    <div class="header-brand">Trips</div>
    <div class="header-actions"><a class="pill ghost sm" href="/hotel-offers">Offer posters</a></div>
  </div>
</header>

<main class="t-main">
  <div id="listChrome">
    <div class="t-hero">
      <div>
        <h1 class="t-h1" id="heroTitle">Trips</h1>
        <p class="t-sub" id="heroSub">Hotel quotations for each client, ready to share.</p>
      </div>
      <button class="pill primary lg" id="btnNew" type="button"><svg class="ic" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="btnNewLabel">New trip</span></button>
    </div>
    <div class="t-bar">
      <nav class="t-tabs" id="tabs"><button class="t-tab on" data-tab="trips">Trips</button><button class="t-tab" data-tab="leads">Trip leads</button></nav>
      <input class="t-find" id="findBox" type="search" placeholder="Search trips" aria-label="Search">
    </div>
  </div>

  <section id="viewTrips"><div class="t-grid" id="tripList"></div></section>
  <section id="viewLeads" hidden></section>
  <section id="viewDetail" hidden></section>
</main>

<dialog class="t-dialog" id="tripDialog">
  <form method="dialog" id="newTripForm">
    <header><h2>New trip</h2><button type="button" class="t-close" data-close aria-label="Close">×</button></header>
    <div class="t-fields">
      <label class="t-fl wide"><span>Client name *</span><input name="client_name" required autocomplete="off"></label>
      <label class="t-fl"><span>Phone</span><input name="client_phone" inputmode="tel" autocomplete="off"></label>
      <label class="t-fl"><span>Destination</span><input name="destination" autocomplete="off"></label>
      <label class="t-fl"><span>Start date</span><input name="start_date" type="date"></label>
      <label class="t-fl"><span>End date</span><input name="end_date" type="date"></label>
      <label class="t-fl wide"><span>Trip name <em>(optional)</em></span><input name="title" placeholder="Defaults to the client name" autocomplete="off"></label>
    </div>
    <footer><span class="ho-hint err" id="tripErr"></span><button type="button" class="pill ghost" data-close>Cancel</button><button type="submit" class="pill primary">Create trip</button></footer>
  </form>
</dialog>

<dialog class="t-dialog" id="leadDialog">
  <form method="dialog" id="leadForm">
    <header><h2>New trip lead</h2><button type="button" class="t-close" data-close aria-label="Close">×</button></header>
    <div class="t-fields">
      <label class="t-fl wide"><span>Client name *</span><input name="name" required autocomplete="off"></label>
      <label class="t-fl"><span>Phone</span><input name="phone" inputmode="tel" autocomplete="off"></label>
      <label class="t-fl"><span>Destination</span><input name="destination" autocomplete="off"></label>
      <label class="t-fl"><span>Travel from</span><input name="travel_from" type="date"></label>
      <label class="t-fl"><span>Travel to</span><input name="travel_to" type="date"></label>
      <label class="t-fl wide"><span>Travellers</span><input name="pax" placeholder="e.g. 2 adults + 1 child" autocomplete="off"></label>
      <label class="t-fl wide"><span>Notes</span><textarea name="notes" rows="3"></textarea></label>
    </div>
    <footer><span class="ho-hint err" id="leadErr"></span><button type="button" class="pill ghost" data-close>Cancel</button><button type="submit" class="pill primary">Add lead</button></footer>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="{{ url_for('hotel_offers.static', filename='trips/tt.js') }}"></script>
<script src="{{ url_for('hotel_offers.static', filename='trips/map_leaflet.js') }}"></script>
<script src="{{ url_for('hotel_offers.static', filename='trips/map.js') }}"></script>
<script src="{{ url_for('hotel_offers.static', filename='trips/quotes.js') }}"></script>
<script src="{{ url_for('hotel_offers.static', filename='trips/leads.js') }}"></script>
<script src="{{ url_for('hotel_offers.static', filename='trips/detail.js') }}"></script>
<script src="{{ url_for('hotel_offers.static', filename='trips/main.js') }}"></script>
</body>
</html>
